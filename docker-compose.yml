version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dfa-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - dfa-network
    restart: unless-stopped

  backend:
    build:
      context: ./DFA-BACKEND
      dockerfile: Dockerfile
    container_name: dfa-backend
    ports:
      - "5000:5000"
    env_file:
      - ./DFA-BACKEND/.env
    depends_on:
      - mongodb
    networks:
      - dfa-network
    restart: unless-stopped

  frontend:
    build:
      context: ./DFA-FRONTEND
      dockerfile: Dockerfile
    container_name: dfa-frontend
    ports:
      - "3000:80"
    env_file:
      - ./DFA-FRONTEND/.env
    depends_on:
      - backend
    networks:
      - dfa-network
    restart: unless-stopped

networks:
  dfa-network:
    driver: bridge

volumes:
  mongodb_data:
