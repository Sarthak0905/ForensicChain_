version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dfa-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - dfa-network
    restart: unless-stopped

  backend:
    build:
      context: ./DFA-BACKEND
      dockerfile: Dockerfile
    container_name: dfa-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/digital-forensic
      - JWT_SECRET=your_jwt_secret_key_here
      - ALLOWED_ORIGINS=http://localhost:3000
      # Firebase and AWS configs will be passed here as well
    depends_on:
      - mongodb
    networks:
      - dfa-network
    restart: unless-stopped

  frontend:
    build:
      context: ./DFA-FRONTEND
      dockerfile: Dockerfile
    container_name: dfa-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - dfa-network
    restart: unless-stopped

networks:
  dfa-network:
    driver: bridge

volumes:
  mongodb_data:
